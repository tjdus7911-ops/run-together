name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          python3 - <<'PY'
          import re
          try:
              lines = open('build.log', encoding='utf-8', errors='replace').read().splitlines()
          except FileNotFoundError:
              lines = []
          picked = []
          for i, line in enumerate(lines):
              if line.startswith('e: ') or ' FAILED' in line or 'error:' in line or 'AAPT: error' in line:
                  picked.append(line)
              if 'What went wrong' in line:
                  picked.extend(lines[i:i + 12])
          picked = picked[:80] or lines[-60:]
          msg = '\n'.join(picked)
          msg = msg.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Build failed::{msg}')
          PY

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: run-together-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "run-together-${GITHUB_REF_NAME}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          files: run-together-${{ github.ref_name }}.apk
