name: Pleos SDK probe

# Pleos Playground 공개 저장소에서 SDK 목록과 공개 API(javap)를 뽑아
# ci/sdk-probe 브랜치에 올립니다. SDK 연동 코드를 실제 함수 시그니처에 맞추려는 용도입니다.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tools/sdk-probe/**'
      - '.github/workflows/pleos-sdk-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Probe Pleos SDK artifacts
        run: python3 tools/sdk-probe/probe.py probe-out

      - name: Publish results to ci/sdk-probe branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd probe-out
          git init -q -b ci/sdk-probe
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Pleos SDK probe results (${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci/sdk-probe
