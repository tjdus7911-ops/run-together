name: Preview frames

# 눌러 보는 미리보기 페이지에 쓰는 화면(1600×900 원본)을 Paparazzi 로 그려 ci/preview-frames 브랜치에 올립니다.
on:
  workflow_dispatch:
  push:
    branches: [ main, 'design/**' ]
    paths:
      - 'app/src/**'
      - '.github/workflows/preview-frames.yml'

permissions:
  contents: write

jobs:
  frames:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Record preview frames
        env:
          PREVIEW_FRAMES: '1'
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon :app:recordPaparazziDebug --tests "com.runtogether.ui.preview.PreviewFramesTest" 2>&1 | tee record.log
          ls app/src/test/snapshots/images | grep -c PreviewFramesTest

      - name: Report errors
        if: failure()
        run: |
          grep -E "^e: |error:|FAILED|What went wrong|Exception" record.log | head -60 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error title=Preview frames failed::/'

      - name: Publish to ci/preview-frames branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out
          cp app/src/test/snapshots/images/*PreviewFramesTest*.png out/
          cd out
          TARGET=ci/preview-frames
          if [ "$GITHUB_REF_NAME" != "main" ]; then TARGET="ci/preview-frames-${GITHUB_REF_NAME//\//-}"; fi
          git init -q -b "$TARGET"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Preview frames (${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$TARGET"
