name: Preview frames

# 눌러 보는 미리보기 페이지에 쓰는 화면(1600×900 원본)을 Paparazzi 로 그려 Actions 아티팩트로 올립니다.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/src/**'
      - '.github/workflows/preview-frames.yml'

jobs:
  frames:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Record preview frames
        env:
          PREVIEW_FRAMES: '1'
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon :app:recordPaparazziDebug --tests "com.runtogether.ui.preview.PreviewFramesTest" 2>&1 | tee record.log
          ls app/src/test/snapshots/images | grep -c PreviewFramesTest

      - name: Report errors
        if: failure()
        run: |
          grep -E "^e: |error:|FAILED|What went wrong|Exception" record.log | head -60 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error title=Preview frames failed::/'

      - uses: actions/upload-artifact@v4
        with:
          name: preview-frames
          path: app/src/test/snapshots/images/*PreviewFramesTest*.png
          if-no-files-found: error
          retention-days: 30
